<div class="max-w-md mx-auto mt-10 overflow-hidden rounded-2xl border border-gray-700 bg-gray-900 shadow-2xl text-white">
  <div class="bg-gradient-to-r from-blue-600 via-indigo-500 to-purple-500 px-6 py-6 text-center">
    <h2 class="text-2xl font-extrabold tracking-tight text-white">Editar Maestro</h2>
    <p class="mt-1 text-sm text-blue-100">Modifica los datos del maestro seleccionado</p>
  </div>

  <form [formGroup]="formulario" (ngSubmit)="onSubmit()" class="p-6 space-y-5">
    <div>
      <label class="block text-sm font-semibold text-gray-400 mb-1">ID Maestro (No modificable)</label>
      <input type="text" formControlName="idmaestro" readonly class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-gray-400 text-sm cursor-not-allowed">
    </div>
    <div>
      <label class="block text-sm font-semibold text-gray-300 mb-1">Nombre</label>
      <input type="text" formControlName="nombre" class="w-full bg-gray-800 border border-gray-600 rounded-lg p-2.5 text-white text-sm focus:border-blue-500 focus:outline-none">
    </div>
    <div>
      <label class="block text-sm font-semibold text-gray-300 mb-1">Apellido Paterno</label>
      <input type="text" formControlName="apaterno" class="w-full bg-gray-800 border border-gray-600 rounded-lg p-2.5 text-white text-sm focus:border-blue-500 focus:outline-none">
    </div>
    <div>
      <label class="block text-sm font-semibold text-gray-300 mb-1">Apellido Materno</label>
      <input type="text" formControlName="amaterno" class="w-full bg-gray-800 border border-gray-600 rounded-lg p-2.5 text-white text-sm focus:border-blue-500 focus:outline-none">
    </div>
    <div>
      <label class="block text-sm font-semibold text-gray-300 mb-1">Correo</label>
      <input type="email" formControlName="correo" class="w-full bg-gray-800 border border-gray-600 rounded-lg p-2.5 text-white text-sm focus:border-blue-500 focus:outline-none">
    </div>

    <div class="flex items-center justify-between pt-2">
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm px-5 py-2.5 transition shadow-lg">
        Modificar
      </button>
      <button type="button" [routerLink]="['/utl/maestros']" class="bg-gray-700 hover:bg-gray-800 text-white font-medium rounded-lg text-sm px-5 py-2.5 transition">
        Cancelar
      </button>
    </div>
  </form>
</div>
