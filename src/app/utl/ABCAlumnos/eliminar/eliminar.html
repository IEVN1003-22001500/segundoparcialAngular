<div class="min-h-screen flex justify-center items-center bg-gray-900 p-4">
  
  <!-- Tarjeta (Card) -->
  <div class="bg-gray-800 block max-w-sm w-full p-6 border border-gray-700 rounded-2xl shadow-xl text-white">
    
    <div class="text-center mb-4">
      <h2 class="text-xl font-bold text-red-500">¿Eliminar Alumno?</h2>
      <p class="text-xs text-gray-400">Esta acción no se puede deshacer</p>
    </div>

    <div class="mb-6 bg-gray-900 p-4 rounded-lg border border-gray-700 space-y-2 text-sm">
      <p class="font-semibold text-orange-400">
        Matrícula: {{ regAlumno.matricula }}
      </p>
      <p class="text-gray-300">
        <span class="font-medium text-gray-400">Nombre:</span> {{ regAlumno.nombre }} {{ regAlumno.apaterno }} {{ regAlumno.amaterno }}
      </p>
      <p class="text-gray-300">
        <span class="font-medium text-gray-400">Correo:</span> {{ regAlumno.correo }}
      </p>
    </div>

    <!-- Botones de Acción -->
    <div class="flex items-center justify-between gap-3">
      
      <!-- Botón Confirmar Eliminar -->
      <button
        type="button"
        (click)="bajaAlumno()"
        class="w-full text-white bg-red-600 hover:bg-red-700 focus:ring-4 focus:ring-red-900 font-medium rounded-lg text-sm px-4 py-2.5 text-center transition"
      >
        Sí, Eliminar
      </button>

      <!-- Botón Cancelar -->
      <a
        [routerLink]="['/utl/alumnos']"
        class="w-full inline-flex justify-center items-center text-gray-300 bg-gray-700 hover:bg-gray-600 focus:ring-4 focus:ring-gray-800 font-medium rounded-lg text-sm px-4 py-2.5 transition"
      >
        Cancelar
        <svg
          class="w-4 h-4 ms-1.5 rtl:rotate-180 -me-0.5"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 12H5m14 0-4 4m4-4-4-4"
          />
        </svg>
      </a>

    </div>

  </div>
</div>
